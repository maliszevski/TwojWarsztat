<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nowe zlecenie serwisowe</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Własny CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Twój Warsztat</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Klienci</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vehicles}">Pojazdy</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/repair_orders}">Zlecenia napraw</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO / Formularz -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4">
                <h2 class="card-title text-center mb-4">Stwórz nowe zlecenie naprawy</h2>

                <form th:action="@{/repair_orders/create}" th:object="${repairOrderDTO}" method="post">
                    <!-- Dane klienta -->
                    <h4 class="mb-3">Dane klienta</h4>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control rounded" th:field="*{customerName}" placeholder="Imię">
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control rounded" th:field="*{customerSurname}" placeholder="Nazwisko">
                        </div>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control rounded" th:field="*{customerEmail}" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded" th:field="*{customerPhone}" placeholder="Telefon">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded" th:field="*{customerNipNumber}" placeholder="NIP">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded" th:field="*{customerAddress}" placeholder="Adres">
                    </div>

                    <!-- Dane pojazdu -->
                    <h4 class="mb-3 mt-4">Dane pojazdu</h4>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control rounded" th:field="*{vehicleBrand}" placeholder="Marka">
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control rounded" th:field="*{vehicleModel}" placeholder="Model">
                        </div>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded" th:field="*{vehicleVinNumber}" placeholder="VIN">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded" th:field="*{vehicleRegistrationNumber}" placeholder="Numer rejestracyjny">
                    </div>

                    <!-- Opis naprawy -->
                    <h4 class="mb-3 mt-4">Opis zlecenia</h4>
                    <div class="mb-3">
                        <textarea class="form-control rounded" th:field="*{description}" rows="4"></textarea>
                    </div>

                    <!-- Przyciski -->
                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Stwórz nowe zlecenie</button>
                        <a th:href="@{/}" class="btn btn-secondary btn-lg">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- STOPKA -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p class="m-0">© 2025 Twój Warsztat – System zarządzania warsztatem.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
